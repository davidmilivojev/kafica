<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Auto — promena boje</title>
<style>
:root{--car:#f3f3f1}
*{box-sizing:border-box}
body{
  margin:0;min-height:100svh;display:grid;place-items:center;
  padding:12px;background:#101217;font-family:Arial,sans-serif;color:white
}
.app{width:min(900px,100%)}
.scene{
  position:relative;width:100%;aspect-ratio:1.45/1;overflow:hidden;
  border-radius:24px;
  background:linear-gradient(180deg,#dce5e9 0 68%,#eef2f3 68%);
}
/* ORIGINAL PNG — no filters, no generated face, no image manipulation */
.driver{
  position:absolute;z-index:2;
  width:25%;left:47%;top:13%;
  height:auto;object-fit:contain;
  pointer-events:none;
}
.car{position:absolute;z-index:3;inset:0;color:var(--car)}

.windshield{
  position:absolute;z-index:4;left:50%;top:19%;width:60%;height:31%;
  background:linear-gradient(135deg,rgba(36,50,58,.45),rgba(8,17,24,.72));
  clip-path:polygon(7% 100%,18% 13%,27% 5%,73% 5%,82% 13%,94% 100%);
  pointer-events:none;
  opacity: 0.2;
  transform: translateX(-50%);
}
.body{
  position:absolute;z-index:5;left:7%;right:5%;bottom:12%;height:47%;
  background:var(--car);border:3px solid #151719;
  border-radius:46% 43% 15% 15%/44% 44% 18% 18%;
  box-shadow:inset 0 -22px 30px rgba(0,0,0,.15);
}
.hood{
  position:absolute;z-index:6;left:21%;right:17%;bottom:43%;height:17%;
  background:color-mix(in srgb,var(--car),white 5%);
  clip-path:polygon(5% 0,95% 0,83% 100%,17% 100%);
}
.light{
  position:absolute;z-index:8;bottom:39%;width:20%;height:8%;
  background:#eef8fb;border:3px solid #121416
}
.light.l{left:12%;border-radius:65% 25% 55% 40%;transform:rotate(9deg)}
.light.r{right:10%;border-radius:25% 65% 40% 55%;transform:rotate(-9deg)}
.grille{
  position:absolute;z-index:9;left:31%;bottom:22%;width:40%;height:19%;
  border:4px solid #16181a;border-radius:45%;
  background:radial-gradient(circle,#d8dde0 0 1.5px,#111 2px 5px);
  background-size:10px 10px;overflow:hidden
}
.emblem{
  position:absolute;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);
  width:20%;aspect-ratio:1;border:4px solid #dfe4e7;border-radius:50%;
  background:#111;box-shadow:0 0 0 2px #111
}
.emblem:before,.emblem:after,.emblem span{
  content:"";position:absolute;left:50%;top:50%;width:3px;height:42%;
  background:#e5e8ea;transform-origin:50% 100%
}
.emblem:before{transform:translate(-50%,-100%) rotate(0)}
.emblem:after{transform:translate(-50%,-100%) rotate(120deg)}
.emblem span{transform:translate(-50%,-100%) rotate(240deg)}
.intake{
  position:absolute;z-index:9;bottom:20%;width:17%;height:13%;
  background:#0b0d0f;border-radius:35% 55% 35% 55%
}
.intake.l{left:11%}.intake.r{right:9%;transform:scaleX(-1)}
.wheel{
  position:absolute;z-index:1;bottom:8%;width:18%;height:17%;
  background:#090a0b;border-radius:50%
}
.wheel.l{left:12%}.wheel.r{right:9%}
.controls{
  display:flex;justify-content:center;gap:10px;flex-wrap:wrap;
  padding:17px 5px 2px
}
.swatch{
  width:48px;height:48px;border-radius:50%;border:3px solid #ffffff80;
  background:var(--c);cursor:pointer
}
.swatch.active{outline:3px solid white;outline-offset:3px}
@media(max-width:600px){
  body{padding:0;background:#0e1014}
  .app{width:100%}
  .scene{height:76svh;min-height:480px;aspect-ratio:auto;border-radius:0}
  .car{transform:scale(1.23);transform-origin:center 70%}
  .driver{width:34%;left:43%;top:20%}
  .controls{padding:18px 10px}
  .swatch{width:44px;height:44px}
}
</style>
</head>
<body>
<div class="app">
  <div class="scene">
    <img class="driver" src="nat-original.png" alt="Vozač">
    <div class="car" id="car">
      <div class="wheel l"></div><div class="wheel r"></div>
      <div class="roof"></div>
      <div class="windshield"></div>
      <div class="body"></div><div class="hood"></div>
      <div class="light l"></div><div class="light r"></div>
      <div class="intake l"></div><div class="intake r"></div>
      <div class="grille"><div class="emblem"><span></span></div></div>
    </div>
  </div>
  <div class="controls">
    <button class="swatch active" data-color="#fe84ea" style="--c:#fe84ea" aria-label="Roze"></button>
    <button class="swatch" data-color="#f3f3f1" style="--c:#f3f3f1" aria-label="Bela"></button>
    <button class="swatch" data-color="#17365d" style="--c:#17365d" aria-label="Teget"></button>
    <button class="swatch" data-color="#9e1018" style="--c:#9e1018" aria-label="Crvena"></button>
    <button class="swatch" data-color="#74787c" style="--c:#74787c" aria-label="Siva"></button>
  </div>
</div>
<script>
const car=document.getElementById('car');
document.querySelectorAll('.swatch').forEach(btn=>{
 btn.addEventListener('click',()=>{
   car.style.setProperty('--car',btn.dataset.color);
   document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));
   btn.classList.add('active');
 });
});
</script>
</body>
</html>
