<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cocktail Crush</title>
<style>
:root{--bg:#070a20;--card:#121735;--pink:#ff4fa3;--violet:#a866ff;--muted:#bfc2dc}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#402150,#11132e 42%,#060817);color:#fff;font-family:Arial,sans-serif}
button{font:inherit}.app{width:min(100%,480px);margin:auto;min-height:100vh;padding:18px 14px 32px}
header{text-align:center}h1{font-family:Georgia,serif;color:#ffc4e4;margin:5px 0}.sub{color:#f0a9d1;font-family:cursive;font-size:18px}
.stats{display:flex;gap:7px;margin:15px 0}.stat{flex:1;background:#111735;border:1px solid #67518d;border-radius:15px;padding:8px;text-align:center;font-size:11px}.stat b{display:block;color:#ff91c9;font-size:17px;margin-top:3px}
.drinks{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.drink{background:#151a3a;border:1px solid #64518a;color:#fff;border-radius:17px;padding:10px 4px;cursor:pointer}.drink.active{border:2px solid var(--pink);background:#292044}.drink span{font-size:29px;display:block}.drink small{display:block;color:#bfc2dc;font-size:9px;margin-top:3px}
.game{margin-top:12px;background:#0e1330;border:1px solid #65518d;border-radius:24px;padding:14px;overflow:hidden}.scene{height:260px;display:flex;align-items:flex-end;justify-content:center;position:relative}
.glass{position:relative;width:120px;height:180px;border:4px solid #e9eaff;border-top-width:3px;border-radius:12px 12px 32px 32px;overflow:hidden;background:#fff1;box-shadow:0 0 30px #ff4fa333}
.liquid{position:absolute;bottom:0;left:0;right:0;height:10%;background:linear-gradient(#dff5bd,#6cc66a);transition:height .45s,background .4s}.liquid:after{content:"";position:absolute;top:-5px;left:0;right:0;height:9px;background:#ffffff55;border-radius:50%}
.ice{position:absolute;bottom:55px;left:12px;font-size:23px;letter-spacing:6px;z-index:2;opacity:0;transition:.3s}.garnish{position:absolute;right:-18px;top:0;font-size:42px;z-index:5}.straw{position:absolute;width:6px;height:145px;background:#ff70b5;right:27px;top:-32px;transform:rotate(8deg);border-radius:10px;z-index:1}
.pour{position:absolute;width:9px;height:0;background:#ffca70;left:50%;top:0;border-radius:10px;opacity:0}.pour.go{animation:pour .7s ease}@keyframes pour{0%{height:0;opacity:1}50%{height:150px;opacity:1}100%{height:180px;opacity:0}}
.float{position:absolute;bottom:10px;animation:fly 1.3s ease-out forwards}@keyframes fly{to{transform:translateY(-240px) rotate(80deg);opacity:0}}
.msg{text-align:center;color:#ffd0e7;font-weight:bold;min-height:42px;padding:8px}.step{text-align:center;color:#9fa4c9;font-size:11px;margin-bottom:8px}
.ingredients{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.ing{min-height:72px;border:1px solid #474b72;background:#171d3e;color:#fff;border-radius:13px;padding:7px 3px;cursor:pointer}.ing.selected{border:2px solid var(--pink);background:#292044}.ing span{font-size:25px;display:block}.ing small{display:block;color:#adb1cc;font-size:9px;margin-top:3px}
.actions{display:flex;gap:8px;margin-top:11px}.actions button{flex:1;border:0;border-radius:14px;padding:13px 7px;color:#fff;font-weight:bold;cursor:pointer}.reset{background:#292e51}.mix{background:linear-gradient(90deg,#ff3f98,#a85fff)}
.result{display:none;text-align:center;margin-top:12px;border:1px solid #ff68b1;background:#171a3a;border-radius:18px;padding:14px}.result.show{display:block}.stars{font-size:25px}.result h3{margin:7px}.recipe{color:#bfc2dc;font-size:11px;line-height:1.5}
</style>
</head>
<body>
<div class="app">
<header><h1>🍸 COCKTAIL CRUSH</h1><div class="sub">Napravi svoj omiljeni koktel ♡</div></header>
<div class="stats"><div class="stat">UKUS<b id="taste">0%</b></div><div class="stat">STYLE<b id="style">0%</b></div><div class="stat">HEMIJA<b id="chem">50%</b></div></div>
<div class="drinks">
<button class="drink active" data-d="mojito"><span>🌿</span>Mojito<small>fresh & cool</small></button>
<button class="drink" data-d="devil"><span>😈</span>Devil Iced Tea<small>dangerously good</small></button>
<button class="drink" data-d="maitai"><span>🌺</span>Mai Tai<small>tropical mood</small></button>
</div>
<div class="game">
<div class="scene"><div id="pour" class="pour"></div><div class="glass"><div class="straw"></div><div id="liquid" class="liquid"></div><div id="ice" class="ice">🧊🧊</div><div id="garnish" class="garnish">🌿</div></div><div id="fx"></div></div>
<div id="msg" class="msg">Mojito izabran. Dodaj sastojke 👇</div>
<div id="step" class="step">0 / 5 sastojaka</div>
<div id="ingredients" class="ingredients"></div>
<div class="actions"><button class="reset" id="reset">↻ ISPOČETKA</button><button class="mix" id="mix">SHAKE / MIX ✨</button></div>
</div>
<div id="result" class="result"><div id="stars" class="stars"></div><h3 id="resultTitle"></h3><div id="resultText"></div><div id="recipe" class="recipe"></div></div>
</div>
<script>
const D={
mojito:{name:"Mojito",g:"🌿",c:["#dff5bd","#6cc66a"],right:["Beli rum","Limeta","Nana","Soda","Led"],items:[["🥃","Beli rum"],["🍋","Limeta"],["🌿","Nana"],["💧","Soda"],["🧊","Led"],["🍓","Jagoda"],["🥤","Cola"],["🍊","Narandža"],["🍒","Višnja"]]},
devil:{name:"Devil Iced Tea",g:"😈",c:["#f06b72","#7b1932"],right:["Vodka","Rum","Limun","Cola","Led"],items:[["🍸","Vodka"],["🥃","Rum"],["🍋","Limun"],["🥤","Cola"],["🧊","Led"],["🌶️","Chili"],["🍓","Jagoda"],["🌿","Nana"],["🍊","Narandža"]]},
maitai:{name:"Mai Tai",g:"🌺",c:["#ffc15d","#e75a4f"],right:["Rum","Limeta","Narandža","Sirup","Led"],items:[["🥃","Rum"],["🍋","Limeta"],["🍊","Narandža"],["🍯","Sirup"],["🧊","Led"],["🍍","Ananas"],["🥤","Cola"],["🌿","Nana"],["🍒","Višnja"]]}
};
let current="mojito",chosen=[];
const $=x=>document.getElementById(x);
function render(){
 const d=D[current]; $("garnish").textContent=d.g;$("liquid").style.background=`linear-gradient(${d.c[0]},${d.c[1]})`;
 $("ingredients").innerHTML=d.items.map((x,i)=>`<button class="ing" data-i="${i}"><span>${x[0]}</span>${x[1]}<small>dodaj u čašu</small></button>`).join("");
 document.querySelectorAll(".ing").forEach(b=>b.onclick=()=>add(+b.dataset.i,b));$("step").textContent=`${chosen.length} / 5 sastojaka`;
}
function add(i,b){
 const x=D[current].items[i]; if(chosen.includes(x[1]))return;if(chosen.length>=5){say("Čaša je puna — vreme je za MIX! 🍹");return}
 chosen.push(x[1]);b.classList.add("selected");$("liquid").style.height=(10+chosen.length*15)+"%";$("step").textContent=`${chosen.length} / 5 sastojaka`;
 $("pour").classList.remove("go");void $("pour").offsetWidth;$("pour").classList.add("go");if(x[1]=="Led")$("ice").style.opacity=1;pop(x[0]);say(`${x[0]} ${x[1]} — sipamo!`);
}
function mix(){
 if(chosen.length<3){say("Dodaj bar 3 sastojka pre miksovanja 😏");return}
 const r=D[current].right,h=chosen.filter(x=>r.includes(x)).length,t=Math.round(h/r.length*100),s=Math.min(100,55+chosen.length*8),c=Math.min(100,50+h*9);
 $("taste").textContent=t+"%";$("style").textContent=s+"%";$("chem").textContent=c+"%";
 $("stars").textContent="⭐".repeat(t>=90?5:t>=70?4:t>=50?3:2);
 $("resultTitle").textContent=t>=90?"Perfect cocktail! 💗":t>=70?"Ovo obećava 😏":"Zanimljiv eksperiment 😄";
 $("resultText").textContent=t>=90?"Okej… ovaj koktel zaslužuje da ga probamo uživo. 🍸":t>=70?"Još malo i dobijaš mesto za šankom.":"Možda je sledeći pametnije da napravimo zajedno. 😏";
 $("recipe").textContent="Tvoj mix: "+chosen.join(" • ");$("result").classList.add("show");say("SHAKE... SHAKE... gotovo! ✨");
 for(let i=0;i<14;i++)setTimeout(()=>pop(["✨","💗","🍹"][i%3]),i*60);
}
function reset(){chosen=[];$("taste").textContent="0%";$("style").textContent="0%";$("chem").textContent="50%";$("liquid").style.height="10%";$("ice").style.opacity=0;$("result").classList.remove("show");render();say("Nova runda — napravi ga po svom ukusu 🍹")}
function say(t){$("msg").textContent=t}
function pop(e){let s=document.createElement("span");s.className="float";s.textContent=e;s.style.left=(15+Math.random()*70)+"%";s.style.fontSize=(18+Math.random()*15)+"px";$("fx").appendChild(s);setTimeout(()=>s.remove(),1400)}
document.querySelectorAll(".drink").forEach(b=>b.onclick=()=>{document.querySelectorAll(".drink").forEach(x=>x.classList.remove("active"));b.classList.add("active");current=b.dataset.d;reset();say(D[current].name+" izabran. Dodaj sastojke 👇")});
$("mix").onclick=mix;$("reset").onclick=reset;render();
</script>
</body></html>
