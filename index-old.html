<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Shopping Mission 🛍️</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f7e9ef;color:#261d24;min-height:100svh;display:flex;justify-content:center}.app{width:min(100%,430px);min-height:100svh;background:linear-gradient(#fff7fa,#f7e9ef);position:relative;overflow:hidden;padding-bottom:92px}.top{position:absolute;z-index:5;top:0;left:0;right:0;padding:14px 14px 8px;background:linear-gradient(#fff 10%,rgba(255,255,255,.88),transparent)}.brand{display:flex;align-items:center;justify-content:space-between;font-weight:900}.brand span:first-child{font-size:20px}.money{background:#221b20;color:white;padding:8px 11px;border-radius:18px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.stat{background:#fff;border:1px solid #f1d8e2;border-radius:15px;padding:8px 10px;box-shadow:0 7px 20px #c37b9820}.stat b{display:flex;justify-content:space-between;font-size:12px}.bar{height:7px;background:#f2e6eb;border-radius:9px;overflow:hidden;margin-top:6px}.fill{height:100%;background:linear-gradient(90deg,#ec72a3,#f5b4c9);width:35%;transition:.35s}.hero{height:54svh;min-height:420px;position:relative;background:#171216}.hero img{width:100%;height:100%;object-fit:cover;object-position:center -10%}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 52%,#fff7fa 99%)}.plumbob{position:absolute;z-index:3;top:120px;left:50%;transform:translateX(-50%) rotate(45deg);width:26px;height:38px;background:linear-gradient(135deg,#91ffbd,#16b966);border-radius:5px;box-shadow:0 0 18px #4cff93}.bubble{position:absolute;z-index:4;left:18px;right:18px;bottom:26px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);padding:13px 15px;border-radius:20px;box-shadow:0 10px 30px #0002;font-size:14px;line-height:1.35}.bubble b{display:block;margin-bottom:3px}.panel{position:relative;z-index:4;margin-top:-8px;padding:0 14px}.title{font-size:22px;font-weight:950;margin:8px 2px 3px}.sub{font-size:13px;color:#765e6a;margin:0 2px 12px}.shops{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.shop{position:relative;z-index:8;pointer-events:auto;touch-action:manipulation;cursor:pointer;border:0;background:#fff;border-radius:18px;padding:14px 7px;box-shadow:0 8px 25px #a55c7a18;font-weight:800;color:#352630;min-height:82px}.shop .ico{font-size:25px;display:block;margin-bottom:5px}.shop small{display:block;color:#a06f83;font-weight:700;margin-top:2px}.shop:active{transform:scale(.97)}.bag{margin-top:13px;background:#2a2026;color:#fff;border-radius:20px;padding:13px}.bagtop{display:flex;justify-content:space-between;font-weight:900;font-size:13px}.items{display:flex;gap:7px;overflow:auto;padding-top:9px;min-height:44px}.item{white-space:nowrap;background:#fff1f6;color:#432a35;padding:7px 9px;border-radius:12px;font-size:12px;font-weight:800}.empty{opacity:.65;font-size:12px}.modal{position:fixed;z-index:20;inset:0;background:#21161cc9;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.card{width:min(100%,430px);background:#fff;border-radius:28px 28px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease}.card h2{margin:0 0 5px}.card p{margin:0 0 14px;color:#755f69}.choices{display:grid;gap:9px}.choice{border:1px solid #efd9e2;background:#fff7fa;border-radius:16px;padding:13px;text-align:left;font-weight:850;color:#35252d}.choice span{float:right;color:#b94d78}.close{width:100%;margin-top:10px;border:0;background:none;padding:10px;color:#92717f;font-weight:800}.toast{position:fixed;z-index:30;top:42%;left:50%;transform:translate(-50%,-50%) scale(.8);background:#231a20;color:white;padding:12px 18px;border-radius:20px;font-size:20px;font-weight:950;opacity:0;pointer-events:none}.toast.go{animation:pop .9s ease}.final{display:none;position:fixed;z-index:40;inset:0;background:linear-gradient(160deg,#251a21,#8f4967);color:white;padding:35px 22px;align-items:center;justify-content:center;text-align:center}.final.show{display:flex}.finalbox{max-width:360px}.final h1{font-size:34px;margin:0 0 10px}.final .score{font-size:64px;font-weight:950}.final button{border:0;border-radius:18px;padding:14px 20px;font-weight:900;margin-top:15px}.finish{position:fixed;z-index:10;bottom:12px;left:50%;transform:translateX(-50%);width:min(calc(100% - 28px),402px);border:0;border-radius:19px;padding:15px;background:#e36c9b;color:#fff;font-weight:950;box-shadow:0 12px 30px #b9507b55}@keyframes up{from{transform:translateY(100%)}to{transform:none}}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand"><span>SHOPPING MISSION 🛍️</span><span class="money" id="money">€500</span></div><div class="stats"><div class="stat"><b><span>💗 Mood</span><span id="moodN">35%</span></b><div class="bar"><div class="fill" id="mood"></div></div></div><div class="stat"><b><span>✨ Style match</span><span id="styleN">20%</span></b><div class="bar"><div class="fill" id="style" style="width:20%"></div></div></div></div></div>
  <section class="hero"><img src="sims_girl.png" alt="Shopping character"><div class="bubble" id="bubble"><b>Shopping challenge</b>„Imaš €500. Da vidimo koliko dobro biraš.”</div></section>
  <main class="panel"><div class="title">Gde prvo idemo?</div><p class="sub">Klikni prodavnicu, izaberi stvar i napravi najbolji shopping haul.</p><div class="shops">
    <button type="button" class="shop" onclick="openShop('outfit')"><span class="ico">👗</span>OUTFIT<small>€45–120</small></button>
    <button type="button" class="shop" onclick="openShop('bag')"><span class="ico">👜</span>TORBE<small>€60–160</small></button>
    <button type="button" class="shop" onclick="openShop('shoes')"><span class="ico">👠</span>CIPELE<small>€55–140</small></button>
    <button type="button" class="shop" onclick="openShop('beauty')"><span class="ico">💄</span>BEAUTY<small>€25–80</small></button>
    <button type="button" class="shop" onclick="openShop('coffee')"><span class="ico">☕</span>PAUZA<small>€15–30</small></button>
    <button type="button" class="shop" onclick="openShop('mystery')"><span class="ico">🎁</span>MYSTERY<small>???</small></button>
  </div><div class="bag"><div class="bagtop"><span>SHOPPING BAG</span><span id="count">0 stvari</span></div><div class="items" id="items"><span class="empty">Još je prazna…</span></div></div></main>
  <button class="finish" onclick="finishGame()">ZAVRŠI SHOPPING →</button>
</div>
<div class="modal" id="modal"><div class="card"><h2 id="modalTitle"></h2><p id="modalText"></p><div class="choices" id="choices"></div><button class="close" onclick="closeModal()">Nastavi da razgledamo</button></div></div>
<div class="toast" id="toast"></div>
<div class="final" id="final"><div class="finalbox"><div>SHOPPING COMPLETE</div><h1 id="finalTitle">Perfect haul 🛍️</h1><div class="score" id="score">87%</div><p id="finalText"></p><button onclick="location.reload()">IGRAJ PONOVO</button></div></div>
<script>
let money=500,mood=35,style=20,cart=[];
const data={
outfit:{title:'👗 Outfit challenge',text:'Koji outfit ide u kabinu?',opts:[['Pink power look',95,12,15,'👗 Pink power suit'],['Little black dress',120,8,18,'🖤 Black dress'],['Oversized hoodie',55,-4,3,'🧥 Hoodie']]},
bag:{title:'👜 Bag hunt',text:'Jedna torba mora da ide kući. Koja?',opts:[['Pink statement bag',145,15,14,'👜 Pink bag'],['Minimal black bag',110,7,16,'👜 Black bag'],['Mini bag — nepraktična ali top',75,11,9,'👛 Mini bag']]},
shoes:{title:'👠 Shoe test',text:'Šta uzimamo bez razmišljanja?',opts:[['Elegantne štikle',135,13,17,'👠 Heels'],['Clean sneakers',85,8,12,'👟 Sneakers'],['„Uzmi oba para”',140,18,14,'✨ Shoe combo']]},
beauty:{title:'💄 Beauty corner',text:'Mali detalj koji menja ceo look?',opts:[['Nude lipstick',35,8,9,'💄 Nude lipstick'],['Parfem',80,13,8,'🌸 Perfume'],['Glow kit',55,10,12,'✨ Glow kit']]},
coffee:{title:'☕ Shopping break',text:'Energija pada. Šta naručujemo?',opts:[['Iced latte + cake',24,12,2,'☕ Coffee break'],['Matcha',18,7,4,'🍵 Matcha'],['Preskačemo — još radnji!',0,-6,1,'🏃 Speed shopping']]},
mystery:{title:'🎁 Mystery box',text:'Ne znaš šta je unutra. Rizikuješ €70?',opts:[['Otvaraj!',70,20,18,'🎁 Mystery gift'],['Ne rizikujem',0,-2,0,'🪙 Saved money'],['Ti biraj iznenađenje',55,14,10,'💝 Surprise']]}
};

function openShop(k){let d=data[k];if(!d){toast('Greška — probaj ponovo');return;}document.getElementById('modalTitle').textContent=d.title;document.getElementById('modalText').textContent=d.text;let c=document.getElementById('choices');c.innerHTML='';d.opts.forEach(o=>{let b=document.createElement('button');b.className='choice';b.innerHTML=o[0]+' <span>€'+o[1]+'</span>';b.setAttribute('type','button');b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();buy(o);});c.appendChild(b)});document.getElementById('modal').classList.add('show')}
function buy(o){if(o[1]>money){toast('Nema dovoljno € 😅');return}money-=o[1];mood=Math.max(0,Math.min(100,mood+o[2]));style=Math.max(0,Math.min(100,style+o[3]));cart.push(o[4]);document.getElementById('bubble').innerHTML='<b>'+reaction(o[2])+'</b>'+(['Ovo ide u kesu.','Dobro biraš… nastavi.','Okej, ovo nisam očekivala 👀','Shopping postaje ozbiljan.'][Math.floor(Math.random()*4)]);update();closeModal();toast((o[2]>=10?'+':'')+o[2]+' 💗')}
function reaction(v){return v>=15?'Obožavam! 💕':v>=8?'Dobar izbor ✨':v>0?'Može 😌':'Hmm… 🙄'}
function update(){let moneyEl=document.getElementById('money');moneyEl.textContent='€'+money;document.getElementById('mood').style.width=mood+'%';document.getElementById('style').style.width=style+'%';document.getElementById('moodN').textContent=mood+'%';document.getElementById('styleN').textContent=style+'%';document.getElementById('count').textContent=cart.length+' stvari';document.getElementById('items').innerHTML=cart.length?cart.map(x=>'<span class="item">'+x+'</span>').join(''):'<span class="empty">Još je prazna…</span>'}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.remove('go');void x.offsetWidth;x.classList.add('go')}
function finishGame(){let total=Math.round((mood+style)/2);document.getElementById('score').textContent=total+'%';let title,text;if(cart.length<2){title='Prebrzo si odustala 😄';text='Shopping bag je skoro prazna. Sledeći put moraš ozbiljnije.'}else if(total>=80){title='ICONIC HAUL 💖';text='Pogodila si stil, mood i još ti je ostalo €'+money+'. Sledeći level: ko nosi sve ove kese? 😏'}else if(total>=60){title='Approved ✨';text='Vrlo dobar shopping. Par izbora je bilo rizično, ali prošla si test.'}else{title='Treba ti shopping trening 😅';text='Hemija postoji, ali modni radar traži još jednu rundu.'}document.getElementById('finalTitle').textContent=title;document.getElementById('finalText').textContent=text;document.getElementById('final').classList.add('show')}
</script>
</body></html>
